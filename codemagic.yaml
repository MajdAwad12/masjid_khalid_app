# Unsigned iOS build for the mosque Flutter app.
# This is a compilation/packaging check only; it is NOT an App Store IPA.
workflows:
  ios-unsigned-ipa:
    name: Mosque iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: '3.50.0'
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify build tools
        script: |
          flutter --version
          xcodebuild -version
      - name: Restore locked Flutter dependencies
        script: flutter pub get --enforce-lockfile
      # This Flutter project uses Swift Package Manager, not CocoaPods.
      # There is no ios/Podfile; Flutter/Xcode resolves SwiftPM dependencies.
      - name: Build unsigned iOS app (release)
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          set -eu
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa_unsigned
          tempdir="$(mktemp -d)"
          mkdir -p "$tempdir/Payload"
          cp -R build/ios/iphoneos/Runner.app "$tempdir/Payload/Runner.app"
          (cd "$tempdir" && zip -qry "$CM_BUILD_DIR/build/ios/ipa_unsigned/masjid_khalid_unsigned.ipa" Payload)
          unzip -t build/ios/ipa_unsigned/masjid_khalid_unsigned.ipa
          ls -lh build/ios/ipa_unsigned/masjid_khalid_unsigned.ipa
    artifacts:
      - build/ios/ipa_unsigned/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Build an iOS release with Shorebird, WITHOUT Apple codesigning.
  # The xcarchive is the authoritative input for future signing/export.
  # The unsigned IPA is only an inspection/transport artifact and cannot be
  # uploaded to App Store Connect or installed on ordinary iPhones.
  ios-shorebird-unsigned:
    name: Mosque iOS Shorebird - unsigned IPA and archive
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: '3.50.0'
      xcode: '26.6'
      groups:
        - shorebird
    scripts:
      - name: Verify build environment
        script: |
          set -eu
          flutter --version
          xcodebuild -version
          test -f shorebird.yaml
      - name: Restore locked Flutter packages
        script: flutter pub get --enforce-lockfile
      - name: Install Shorebird CLI
        script: |
          set -eu
          curl -fsSL https://shorebird.dev/install.sh | bash
          echo "PATH=$HOME/.shorebird/bin:$PATH" >> "$CM_ENV"
      - name: Create unsigned Shorebird iOS release archive
        script: |
          set -eu
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "Missing SHOREBIRD_TOKEN: configure it as a secure Codemagic environment variable in the shorebird group."
            exit 1
          fi
          shorebird --version
          # Registers the iOS release on Shorebird, NOT on App Store Connect.
          # No Apple signing, no automatic App Store or TestFlight publishing.
          shorebird release ios --flutter-version=3.50.0 --no-codesign
      - name: Package unsigned IPA and preserve signing archive
        script: |
          set -eu
          ARCHIVE="build/ios/archive/Runner.xcarchive"
          APP="$ARCHIVE/Products/Applications/Runner.app"
          test -d "$ARCHIVE"
          test -d "$APP"
          OUT="$CM_BUILD_DIR/build/ios/shorebird_unsigned"
          mkdir -p "$OUT"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/Payload"
          ditto "$APP" "$TMP/Payload/Runner.app"
          (cd "$TMP" && zip -qry "$OUT/masjid_khalid_shorebird_unsigned.ipa" Payload)
          (cd build/ios/archive && ditto -c -k --keepParent Runner.xcarchive "$OUT/Runner.xcarchive.zip")
          unzip -t "$OUT/masjid_khalid_shorebird_unsigned.ipa" > /dev/null
          unzip -t "$OUT/Runner.xcarchive.zip" > /dev/null
          ls -lh "$OUT"
    artifacts:
      - build/ios/shorebird_unsigned/*.ipa
      - build/ios/shorebird_unsigned/*.zip
      - /tmp/xcodebuild_logs/*.log

  # Started manually. Produces a Shorebird base release and local build artifacts.
  ios-shorebird-app-store:
    name: Mosque iOS Shorebird - signed App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    inputs:
      build_number:
        description: Next unused iOS build number for this version in Apple and Shorebird
        type: number
    environment:
      flutter: '3.50.0'
      xcode: '26.6'
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.masjidkhalidbinwaleed.masjidKhalidApp
      groups:
        - shorebird
        - ios_store
    scripts:
      - name: Check release inputs and restore locked packages
        script: |
          set -eu
          : "${SHOREBIRD_TOKEN:?Configure the shorebird environment group}"
          python3 scripts/ios_release.py check '${{ inputs.build_number }}'
          flutter pub get --enforce-lockfile
      - name: Apply App Store signing profile
        script: |
          xcode-project use-profiles --custom-export-options='{"destination":"export","manageAppVersionAndBuildNumber":false}'
      - name: Build signed Shorebird base
        script: |
          set -eu
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          build_number='${{ inputs.build_number }}'
          version="$(python3 scripts/ios_release.py prepare "$build_number" "$work/store-config.json")"
          unset IOS_STORE_CONFIG_JSON
          git clone --quiet --depth 1 --branch v1.6.149 https://github.com/shorebirdtech/shorebird.git "$work/shorebird"
          "$work/shorebird/bin/shorebird" release ios --flutter-version=3.50.0 \
            --build-name="$version" --build-number="$build_number" \
            --dart-define-from-file="$work/store-config.json" \
            --export-options-plist="$HOME/export_options.plist"
      - name: Validate exported IPA and collect release artifacts
        script: |
          set -eu
          python3 scripts/ios_release.py verify '${{ inputs.build_number }}'
          archive=build/ios/archive/Runner.xcarchive
          test -d "$archive/dSYMs/Runner.app.dSYM"
          out="$(mktemp -d build/ios/release-artifacts.XXXXXX)"
          ditto -c -k --keepParent "$archive" "$out/Runner.xcarchive.zip"
          cp build/ios/ipa/*.ipa "$out/Runner.ipa"
          (cd "$out" && shasum -a 256 Runner.ipa Runner.xcarchive.zip > SHA256SUMS)
          test ! -e build/ios/verified
          mv "$out" build/ios/verified
    artifacts:
      - build/ios/verified/Runner.ipa
      - build/ios/verified/Runner.xcarchive.zip
      - build/ios/verified/SHA256SUMS
